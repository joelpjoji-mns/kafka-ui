name: "MyKafka UI: Build Release JAR"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag, for example mykafka-v2026.05.01-1. Legacy custom-v tags remain supported. Leave empty for an Actions artifact only."
        required: false
        type: string
  push:
    tags:
      - "mykafka-v*"
      - "custom-v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release-jar:
    name: Build downloadable MyKafka UI JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2 # https://github.com/actions/checkout/releases/tag/v4.0.0

      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # https://github.com/actions/setup-java/releases/tag/v4
        with:
          java-version-file: '.java-version'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          release_tag="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}"
          if [[ -z "$release_tag" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
          fi

          if [[ -n "$release_tag" ]]; then
            version="${release_tag#mykafka-v}"
            if [[ "$version" == "$release_tag" ]]; then
              version="${release_tag#custom-v}"
            fi
          else
            version="mykafka-${GITHUB_SHA::7}"
          fi

          asset_name="mykafka-ui-${GITHUB_RUN_NUMBER}.jar"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"
          echo "Resolved release tag: ${release_tag:-<artifact-only>}"
          echo "Resolved asset name: $asset_name"

      - name: Build release JAR
        run: |
          ./gradlew :api:bootJar --no-daemon \
            -Pinclude-frontend=true \
            -Pversion=${{ steps.meta.outputs.version }}
          mkdir -p dist
          cp "api/build/libs/api-${{ steps.meta.outputs.version }}.jar" "dist/${{ steps.meta.outputs.asset_name }}"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # https://github.com/actions/upload-artifact/releases/tag/v4
        with:
          name: mykafka-ui-${{ github.run_number }}
          path: dist/${{ steps.meta.outputs.asset_name }}
          retention-days: 30

      - name: Create or update GitHub Release
        if: ${{ steps.meta.outputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          ASSET_NAME: ${{ steps.meta.outputs.asset_name }}
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          MyKafka UI release JAR.

          Built from commit: $GITHUB_SHA
          Source ref: $GITHUB_REF_NAME
          Workflow run: $GITHUB_RUN_NUMBER
          Release asset: $ASSET_NAME

          Included fork capabilities:
          - Bounded history plus gap-free live topic tailing.
          - Topic Download and Upload workflows with filters, serdes, previews, and multiple formats.
          - Safe consumer offset reset preview with active-consumer protection.
          - Developer Hub, Operations Center, Topic Governance, Audit Explorer, and Record Explorer.
          - AMOLED and Glass UI themes.
          EOF

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "dist/$ASSET_NAME" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "dist/$ASSET_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "MyKafka UI $RELEASE_TAG" \
              --notes-file release-notes.md
          fi

      - name: Verify release asset
        if: ${{ steps.meta.outputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          ASSET_NAME: ${{ steps.meta.outputs.asset_name }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' | grep -Fx "$ASSET_NAME"
