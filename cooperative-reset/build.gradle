plugins {
    id 'java-library'
    id 'maven-publish'
    id 'checkstyle'
}

java {
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    api libs.kafka.clients
    implementation libs.jackson.databind

    testImplementation libs.junit.jupiter.engine
    testImplementation libs.assertj
    testRuntimeOnly libs.junit.platform.launcher
}

test {
    useJUnitPlatform()
}

checkstyle {
    toolVersion = libs.versions.checkstyle.get()
    configFile = rootProject.file('etc/checkstyle/checkstyle.xml')
    ignoreFailures = false
    maxWarnings = 0
    maxErrors = 0
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'cooperative-reset'
            from components.java

            pom {
                name = 'MyKafka UI Cooperative Reset'
                description = 'Consumer-side adapter for cooperative offset resets while a Kafka group remains stable'
                url = 'https://github.com/joelpjoji-mns/Mykafka-Ui'
            }
        }
    }
}